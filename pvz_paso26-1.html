      else fitText('Resistencia: ' + Math.round(info.hp / PEA_DMG) + ' guisantes  ·  Velocidad: ' + info.speed, 'bold', 13, 340, '#4e342e', cx, 270);
    }
    drawWrapped(ok ? info.desc : (isP ? 'Todavía no descubriste esta planta. Seguí avanzando en el modo Historia para conseguirla.' : 'Todavía no conociste a este zombi. Seguí avanzando en el modo Historia para encontrártelo.'), 424, 292, 330, 17, 3, 14, 11, '', '#3e2723', 'left');
    if (ok) {
      rrect(420, 336, 338, 48, 8); ctx.fillStyle = 'rgba(191,54,12,0.10)'; ctx.fill(); ctx.strokeStyle = 'rgba(191,54,12,0.35)'; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = '#bf360c'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'left'; ctx.fillText('DATO CURIOSO', 430, 351);
      drawWrapped(info.fun, 430, 366, 322, 14, 2, 12, 10, 'italic', '#4e342e', 'left');
    }
    ctx.textAlign = 'center';
    roundedButton(28, 398, 120, 38, 'VOLVER', '#546e7a', 16);
  }
  const PLANT_NEEDS = { puffshroom: 'Solo de noche', sunshroom: 'Solo de noche', lily: 'Solo en el agua', lamp: 'Solo con niebla' };

  // ---- Bucle con paso fijo ----
  let last = performance.now(), acc = 0, speedAcc = 0; const STEP = 1000 / 60;
  function loop(t) {
    acc += Math.min(100, t - last); last = t;
    syncCanvas();
    while (acc >= STEP) { if(screen==='playing'){speedAcc += settings.speed || 1;while(speedAcc>=1){if (mode === 'duel') duelTick(); else update();speedAcc-=1;}}else{speedAcc=0;update();} acc -= STEP; }
    syncCanvas(); draw(); requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
